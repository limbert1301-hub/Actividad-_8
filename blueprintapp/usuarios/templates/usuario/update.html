{% extends 'base.html' %}

{% block content %}
<div style="max-width: 450px; margin: 30px auto; padding: 25px; background: #fff; border: 1px solid #dee2e6; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.02);">
    <h1 style="color: #212529; font-size: 1.6rem; margin-top: 0; margin-bottom: 20px; text-align: center;">EDITAR USUARIO</h1>
    
    <form action="{{ url_for('bp_usuario.update', id=usuario.id) }}" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
        <div>
            <label style="display: block; margin-bottom: 5px; font-weight: 500; color: #333;">Nombre:</label>
            <input type="text" name="nombre" value="{{ usuario.nombre }}" required="required" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div>
            <label style="display: block; margin-bottom: 5px; font-weight: 500; color: #333;">Correo:</label>
            <input type="email" name="email" value="{{ usuario.email }}" required="required" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div>
            <label style="display: block; margin-bottom: 5px; font-weight: 500; color: #333;">Contraseña (Nueva o actual):</label>
            <input type="password" name="password" value="{{ usuario.password }}" required="required" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <input type="submit" value="Actualizar" style="flex: 1; background-color: #212529; color: white; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
            <a href="{{ url_for('bp_usuario.index') }}" style="flex: 1; background-color: #6c757d; color: white; padding: 12px; border: none; border-radius: 4px; font-weight: bold; text-align: center; text-decoration: none; box-sizing: border-box;">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
